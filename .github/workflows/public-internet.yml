name: Public internet browser verification

on:
  push:
    branches: [main, feature/secure-agent-city-gateway]
    paths:
      - "server.js"
      - "Dockerfile"
      - "docker-compose.yml"
      - "scripts/verify-existing-server.js"
      - "scripts/start-verified.sh"
      - "agent-terminal.js"
      - "scripts/verify-public-internet.js"
      - "package.json"
      - "package-lock.json"
      - "tests/**"
      - ".github/workflows/public-internet.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-chromium-public-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout browserbro
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install real Chromium and libraries
        run: npx playwright install --with-deps chromium

      - name: Run agent terminal tests
        run: npm run terminal-test

      - name: Run authenticated gateway tests
        run: npm run auth-test

      - name: Verify public HTTPS websites via real BrowserBro
        run: npm run verify:public

  docker-browser-startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout browserbro
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build production Docker image
        run: docker build -t browserbro:ci .

      - name: Start actual BrowserBro container privately
        run: docker run -d --name browserbro-ci -e BROWSERBRO_TOKEN=ci-only-browserbro-test-token -p 127.0.0.1:3101:3101 browserbro:ci

      - name: Open public websites using the Docker browser
        env:
          BROWSERBRO_TOKEN: ci-only-browserbro-test-token
        run: node scripts/verify-existing-server.js

      - name: Collect container logs and clean up
        if: always()
        run: |
          docker ps -a --filter name=browserbro-ci || true
          docker logs browserbro-ci || true
          docker rm -f browserbro-ci || true
