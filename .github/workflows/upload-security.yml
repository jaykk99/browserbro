name: Upload security regression
on:
  pull_request:
    paths:
      - server.js
      - upload-security.js
      - tests/upload-security.test.js
      - .github/workflows/upload-security.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upload-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check server.js && node --check upload-security.js
      - run: node --test tests/upload-security.test.js
