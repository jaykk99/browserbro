name: Diagnose live Agent City Cloudflare browser
on:
  push:
    branches:
      - diagnostics/agent-city-pages-live
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Verify public Cloudflare Pages browser APIs
        run: |
          node <<'JS'
          const site='https://agents-city.pages.dev';
          const statusUrl=site+'/api/browser/status';
          const r=await fetch(statusUrl,{signal:AbortSignal.timeout(16000)});
          const d=await r.json();
          console.log('STATUS',JSON.stringify({http:r.status,code:d.code,connected:d.connected,readerAvailable:d.readerAvailable,renderMode:d.renderMode,message:d.message}));
          if (!r.ok) throw Error('Status API is down');
          if (d.readerAvailable !== true) {
            console.log('Pages site has not yet deployed the Cloudflare-only HTML reader');
            process.exit(2);
          }
          const pageR=await fetch(site+'/api/browser/load',{
            method:'POST',headers:{'content-type':'application/json'},
            body:JSON.stringify({url:'https://example.com',screenshot:false}),
            signal:AbortSignal.timeout(35000),
          });
          const page=await pageR.json();
          console.log('LOAD',JSON.stringify({http:pageR.status,ok:page.ok,source:page.source,renderMode:page.renderMode,title:page.title,hasExampleText:String(page.text).includes('Example Domain'),linkCount:page.links?.length,code:page.code,error:page.error}));
          if (!pageR.ok || page.ok!==true || !String(page.title+' '+page.text).includes('Example Domain')) throw Error('Live webpage fetch not functioning');
          if (d.connected === false && page.renderMode !== 'html-only') throw Error('Reader mode falsely labeled as Chromium');
          if (d.connected === true && page.renderMode !== 'chromium') throw Error('Chromium service failed to render');
          console.log('PASS: Agent City Pages can load real public web content.');
          JS
