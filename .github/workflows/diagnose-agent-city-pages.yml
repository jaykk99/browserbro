name: Verify live Agent City computer browsing
on:
  push:
    branches:
      - diagnostics/agent-city-pages-live
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Verify status, real page rendering, links, and offline routing
        run: |
          node <<'JS'
          const site='https://agents-city.pages.dev';
          const statusR=await fetch(site+'/api/browser/status',{signal:AbortSignal.timeout(12000)});
          const status=await statusR.json();
          console.log('STATUS:',JSON.stringify({http:statusR.status,code:status.code,readerAvailable:status.readerAvailable,connected:status.connected,renderMode:status.renderMode}));
          if(!statusR.ok || status.readerAvailable !== true)throw Error('Cloudflare browser status not deployed');
          for(const url of ['https://example.com','https://www.iana.org/help/example-domains']) {
            const r=await fetch(site+'/api/browser/load',{
              method:'POST',headers:{'Content-Type':'application/json'},
              body:JSON.stringify({url,screenshot:true}),
              signal:AbortSignal.timeout(40000),
            });
            const page=await r.json();
            const report={target:url,http:r.status,ok:page.ok,mode:page.renderMode,
              source:page.source,title:page.title,textLength:page.text?.length,
              links:page.links?.length,screenshot:!!page.screenshot,
              error:page.error};
            console.log('LOAD:',JSON.stringify(report));
            if(!r.ok || page.ok !== true || !page.title || !page.text?.trim())throw Error('Real browser cannot load '+url);
            if(page.renderMode === 'html-only' && page.screenshot!==null)throw Error('HTML reader fabricated a screenshot');
            if(page.renderMode === 'chromium' && status.connected!==true)throw Error('Chromium response with disconnected status');
          }
          const bad=await fetch(site+'/api/browser/load',{
            method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({url:'http://127.0.0.1/private'}),signal:AbortSignal.timeout(10000),
          });
          console.log('BLOCK_PRIVATE:',bad.status,(await bad.json()).error);
          if(bad.status!==400)throw Error('Private URL was not blocked');
          console.log('PASS: live Agent City browser API is serving actual webpages, not old tunnel errors.');
          JS
