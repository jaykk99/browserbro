name: Inspect live Agent City Cloudflare deployment
on:
  push:
    branches:
      - diagnostics/agent-city-pages-live
  workflow_dispatch:
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect full health, real navigation and deployed assets
        run: |
          node <<'JS'
          const base='https://agents-city.pages.dev';
          for(const path of ['/api/browser/status','/']) {
            try{
              const response=await fetch(base+path+'?check='+Date.now(),{headers:{'cache-control':'no-cache'},signal:AbortSignal.timeout(14000)});
              const body=await response.text();
              console.log('SITE',path,'http',response.status,
                'type',response.headers.get('content-type'),
                'cf-cache',response.headers.get('cf-cache-status'),
                'last-modified',response.headers.get('last-modified'));
              console.log('BODY',path,body.slice(0,path==='/'?800:1500));
            }catch(error){console.log('FAILED',path,error.message);}
          }
          const r=await fetch(base+'/api/browser/load',{
            method:'POST',headers:{'content-type':'application/json','cache-control':'no-cache'},
            body:JSON.stringify({url:'https://example.com/',screenshot:false}),
            signal:AbortSignal.timeout(25000),
          });
          console.log('LOAD_HTTP',r.status,'LOAD_BODY',(await r.text()).slice(0,2400));
          JS
