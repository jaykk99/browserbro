name: Smoke-test live BrowserBro dashboard on Agent City
on:
  push:
    branches: [diagnostics/agent-city-pages-live]
permissions: {contents: read}
jobs:
  browserbro-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright Chromium
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Real browser UI and Chromium backend smoke test
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1200,height:850}});
            const messages=[];
            page.on('pageerror', e=>messages.push(String(e)));
            const home=await page.goto('https://agents-city.pages.dev/?browserbro=1',{
              waitUntil:'domcontentloaded',timeout:30000});
            console.log('SITE',home.status());
            await page.getByText('AGENT WEB WORKSPACE').waitFor({timeout:20000});
            const labels=await page.locator('body').innerText();
            console.log('BODY_TEXT',JSON.stringify(labels.slice(0,3500)));
            console.log('DOM_INFO',JSON.stringify({asides:await page.locator('aside').count(),headings:await page.locator('h2').allTextContents(),errors:messages}));
            for(const label of ['Browser tabs','Navigate / act','Live view','Output','Search real web']){
              if(!labels.toLowerCase().includes(label.toLowerCase()))throw Error('Missing BrowserBro dashboard UI: '+label);
            }
            console.log('UI_OK',JSON.stringify({dashboard:true,addressField:await page.getByRole('textbox',{name:'BrowserBro address bar'}).count(),newTab:await page.getByRole('button',{name:'New browser tab'}).count(),console:await page.getByRole('button',{name:/Console/}).count(),clientErrors:messages}));
            const state=await (await fetch('https://agents-city.pages.dev/api/browser/status')).json();
            console.log('STATUS',JSON.stringify({connected:state.connected,code:state.code,renderMode:state.renderMode}));
            await page.getByRole('button',{name:'Open example.com'}).click();
            await page.getByText('Fetching a real webpage...').waitFor({state:'hidden',timeout:60000});
            console.log('LOAD_VIEW',JSON.stringify({
              loaded:await page.getByText('Example Domain',{exact:false}).count(),
              imgCount:await page.locator('img[alt^="Actual Chromium screenshot"]').count(),
              alert:await page.getByRole('alert').allInnerTexts(),
              text: (await page.locator('main').innerText()).slice(-500),
              clientErrors:messages,
            }));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
