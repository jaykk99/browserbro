name: Verify deployed Agent City BrowserBro UI
on:
  push:
    branches: [diagnostics/agent-city-pages-live]
permissions: {contents: read}
jobs:
  public-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Check BrowserBro Chromium API and production JS bundle
        shell: bash
        run: |
          node <<'JS'
          const base='https://agents-city.pages.dev';
          const statusResp=await fetch(base+'/api/browser/status',{signal:AbortSignal.timeout(12000)});
          const status=await statusResp.json();
          console.log('STATUS',JSON.stringify({connected:status.connected,code:status.code,renderMode:status.renderMode}));
          const homeResp=await fetch(base+'/?browserbro=1',{signal:AbortSignal.timeout(12000)});
          const html=await homeResp.text();
          console.log('HTML',homeResp.status,html.length);
          const assets=[...html.matchAll(/(?:src|href)="(\/assets\/[^"]+\.js)"/g)].map(x=>x[1]);
          console.log('SCRIPTS',assets);
          if(!assets.length)throw Error('Cannot find production JS entry');
          let hasDashboard=false;
          for(const path of assets) {
            const r=await fetch(base+path,{signal:AbortSignal.timeout(15000)});
            const js=await r.text();
            console.log('SCRIPT',path,js.length,'HAS_BROWSERBRO_WORKSPACE',js.includes('Agent Browser Workspace'),'HAS_LIVE_VIEW',js.includes('Live view'));
            if(js.includes('Agent Browser Workspace') && js.includes('Browser tabs')) hasDashboard=true;
          }
          if(!hasDashboard)throw Error('New BrowserBro dashboard not deployed yet');
          const nav=await fetch(base+'/api/browser/load',{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({url:'https://example.com',screenshot:true}),
            signal:AbortSignal.timeout(50000)});
          const data=await nav.json();
          console.log('NAV',JSON.stringify({status:nav.status,mode:data.renderMode,title:data.title,screenshot:!!data.screenshot}));
          if(!nav.ok || data.renderMode!=='chromium' || !data.screenshot)throw Error('Real Chromium navigation/screenshot failed');
          console.log('PASS: public BrowserBro dashboard shipped with real Chromium browser backend');
          JS
