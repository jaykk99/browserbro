name: Check live BrowserBro Worker and computer API
on:
  push:
    branches: [diagnostics/agent-city-pages-live]
permissions: {contents: read}
jobs:
  public-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: BrowserBro connected status and rendered page
        shell: bash
        run: |
          node <<'JS'
          const base='https://agents-city.pages.dev';
          const statusR=await fetch(base+'/api/browser/status',{signal:AbortSignal.timeout(15000),headers:{'cache-control':'no-cache'}});
          const status=await statusR.json();
          console.log('STATUS',JSON.stringify(status));
          const navR=await fetch(base+'/api/browser/load',{
            method:'POST',headers:{'content-type':'application/json'},
            body:JSON.stringify({url:'https://example.com/',screenshot:true}),
            signal:AbortSignal.timeout(50000)});
          const nav=await navR.json();
          console.log('NAV',JSON.stringify({status:navR.status,ok:nav.ok,source:nav.source,
            renderMode:nav.renderMode,title:nav.title,hasScreenshot:!!nav.screenshot,
            screenshotSize:nav.screenshot?.length,textLength:nav.text?.length,links:nav.links?.length,error:nav.error,
            warning:nav.warning}));
          JS
