name: BrowserBro checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check server.js
      - run: npm run auth-test
      - run: npm run terminal-test
      - run: npm run bridge-test
      - run: npm run actions-test
      - run: node --test tests/profile-validation.test.js
